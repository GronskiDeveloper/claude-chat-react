<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Podgląd komponentu ClaudeChat React — panel czatu ze streamującą odpowiedzią, ikona React w tle">
  <defs>
    <linearGradient id="bgR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.55" stop-color="#302b63"/>
      <stop offset="1" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="userBubbleR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D9E75"/>
      <stop offset="1" stop-color="#178f68"/>
    </linearGradient>
    <filter id="cardShadowR" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="launcherShadowR" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="url(#bgR)"/>

  <!-- Faint React atom mark in the background (left half) -->
  <g transform="translate(320, 360)" opacity="0.10" stroke="#61DAFB" stroke-width="3" fill="none">
    <ellipse cx="0" cy="0" rx="140" ry="52"/>
    <ellipse cx="0" cy="0" rx="140" ry="52" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="140" ry="52" transform="rotate(120)"/>
    <circle cx="0" cy="0" r="10" fill="#61DAFB"/>
  </g>

  <!-- Top nav (faint) -->
  <g opacity="0.6">
    <rect x="0" y="0" width="1200" height="60" fill="rgba(255,255,255,0.03)"/>
    <text x="32" y="38" font-family="ui-sans-serif, -apple-system" font-size="16" fill="rgba(255,255,255,0.7)" font-weight="700">saas.app</text>
    <g transform="translate(870, 38)" font-family="ui-sans-serif" font-size="13" fill="rgba(255,255,255,0.5)">
      <text x="0">Features</text>
      <text x="88">Pricing</text>
      <text x="163">Docs</text>
      <text x="230">Login</text>
    </g>
  </g>

  <!-- Hero copy -->
  <g opacity="0.55">
    <text x="80" y="220" font-family="ui-sans-serif, -apple-system" font-size="52" fill="rgba(255,255,255,0.72)" font-weight="800">React app.</text>
    <text x="80" y="285" font-family="ui-sans-serif, -apple-system" font-size="52" fill="rgba(255,255,255,0.4)" font-weight="800" font-style="italic">Drop-in AI chat.</text>
    <rect x="80" y="330" width="420" height="14" rx="3" fill="rgba(255,255,255,0.08)"/>
    <rect x="80" y="356" width="380" height="14" rx="3" fill="rgba(255,255,255,0.08)"/>
    <rect x="80" y="382" width="300" height="14" rx="3" fill="rgba(255,255,255,0.08)"/>
    <rect x="80" y="440" width="180" height="48" rx="8" fill="rgba(29,158,117,0.35)"/>
    <text x="170" y="470" font-family="ui-sans-serif" font-size="14" fill="rgba(255,255,255,0.85)" text-anchor="middle" font-weight="600">Try demo</text>
  </g>

  <!-- Code snippet (mid-left) -->
  <g transform="translate(60, 540)" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="13" fill="rgba(255,255,255,0.35)">
    <text>&lt;ClaudeChat endpoint="/api/chat" accentColor="#1D9E75" /&gt;</text>
  </g>

  <!-- Chat panel (right, front) -->
  <g transform="translate(760, 130)" filter="url(#cardShadowR)">
    <rect x="0" y="0" width="380" height="530" rx="18" fill="#1b1b1f"/>

    <!-- Header -->
    <path d="M 0 0 h 380 v 60 h -380 z" fill="#1D9E75"/>
    <text x="24" y="38" font-family="ui-sans-serif, -apple-system" font-size="15" fill="#ffffff" font-weight="600">Ask us</text>
    <text x="356" y="38" font-family="ui-sans-serif" font-size="22" fill="#ffffff" text-anchor="end">×</text>

    <!-- Greeting -->
    <g transform="translate(20, 90)">
      <rect x="0" y="0" width="270" height="50" rx="14" fill="#2c2c32"/>
      <text x="16" y="21" font-family="ui-sans-serif" font-size="13" fill="#f2f2f5">Hi! How can I help you</text>
      <text x="16" y="39" font-family="ui-sans-serif" font-size="13" fill="#f2f2f5">today?</text>
    </g>

    <!-- User -->
    <g transform="translate(110, 160)">
      <rect x="0" y="0" width="250" height="34" rx="14" fill="url(#userBubbleR)"/>
      <text x="16" y="22" font-family="ui-sans-serif" font-size="13" fill="#ffffff">What plans do you offer?</text>
    </g>

    <!-- Bot answer (streaming) -->
    <g transform="translate(20, 214)">
      <rect x="0" y="0" width="320" height="108" rx="14" fill="#2c2c32"/>
      <text x="16" y="22" font-family="ui-sans-serif" font-size="13" fill="#f2f2f5">We have three tiers:</text>
      <text x="16" y="42" font-family="ui-sans-serif" font-size="13" fill="#f2f2f5">Starter (free, 100 messages/mo),</text>
      <text x="16" y="62" font-family="ui-sans-serif" font-size="13" fill="#f2f2f5">Pro ($29/mo, 5k messages), and</text>
      <text x="16" y="82" font-family="ui-sans-serif" font-size="13" fill="#f2f2f5">Team ($99/mo, unlimited).</text>
      <text x="16" y="98" font-family="ui-sans-serif" font-size="13" fill="rgba(242,242,245,0.4)">▊</text>
    </g>

    <!-- User -->
    <g transform="translate(180, 342)">
      <rect x="0" y="0" width="180" height="34" rx="14" fill="url(#userBubbleR)"/>
      <text x="16" y="22" font-family="ui-sans-serif" font-size="13" fill="#ffffff">Book a demo call</text>
    </g>

    <!-- Bot typing indicator -->
    <g transform="translate(20, 396)">
      <rect x="0" y="0" width="80" height="30" rx="14" fill="#2c2c32"/>
      <circle cx="22" cy="15" r="4" fill="#7F77DD" opacity="0.9"/>
      <circle cx="40" cy="15" r="4" fill="#7F77DD" opacity="0.6"/>
      <circle cx="58" cy="15" r="4" fill="#7F77DD" opacity="0.3"/>
    </g>

    <!-- Input -->
    <line x1="0" y1="460" x2="380" y2="460" stroke="#38383f"/>
    <rect x="16" y="474" width="270" height="42" rx="10" fill="#1b1b1f" stroke="#38383f"/>
    <text x="32" y="500" font-family="ui-sans-serif" font-size="13" fill="rgba(242,242,245,0.4)">Type a message…</text>
    <rect x="298" y="474" width="66" height="42" rx="10" fill="#1D9E75"/>
    <text x="331" y="500" font-family="ui-sans-serif" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">Send</text>
  </g>

  <!-- Data-flow annotation (top-right corner) -->
  <g transform="translate(780, 90)" font-family="ui-monospace, monospace" font-size="11">
    <text x="0" y="0" fill="#5DCAA5">&lt;ClaudeChat/&gt;</text>
    <text x="115" y="0" fill="rgba(255,255,255,0.4)">──▶</text>
    <text x="158" y="0" fill="#EF9F27">your proxy</text>
    <text x="248" y="0" fill="rgba(255,255,255,0.4)">──▶</text>
    <text x="291" y="0" fill="#7F77DD">Claude API</text>
    <text x="0" y="16" fill="rgba(255,255,255,0.5)">API key stays server-side · SSE streaming</text>
  </g>

  <!-- Launcher (bottom-right) -->
  <g transform="translate(1080, 620)" filter="url(#launcherShadowR)">
    <circle cx="0" cy="0" r="34" fill="#1D9E75"/>
    <text x="0" y="8" font-family="ui-sans-serif" font-size="26" fill="#ffffff" text-anchor="middle">💬</text>
  </g>

  <!-- Bottom footer -->
  <g transform="translate(0, 700)">
    <text x="32" y="0" font-family="ui-monospace, monospace" font-size="11" fill="rgba(255,255,255,0.4)">@grodev/claude-chat-react · MIT · @GronskiDeveloper</text>
    <text x="1168" y="0" font-family="ui-monospace, monospace" font-size="11" fill="rgba(255,255,255,0.4)" text-anchor="end">React 18+ · TypeScript · Zero runtime deps · ~8 KB gz</text>
  </g>
</svg>
